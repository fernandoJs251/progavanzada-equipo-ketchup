<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181824"/>
      <stop offset="100%" stop-color="#0e0e17"/>
    </linearGradient>
    <linearGradient id="shellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  <g transform="translate(50, 40)">
    <!-- Calota exterior -->
    <path d="M 120 280 C 70 250, 60 160, 100 100 C 140 40, 260 30, 310 80 C 350 120, 350 200, 320 280 C 300 320, 260 350, 200 350 C 150 350, 130 310, 120 280 Z" fill="url(#shellGrad)" stroke="#27272a" stroke-width="6"/>
    <!-- Visera -->
    <path d="M 170 140 C 220 130, 280 140, 310 180 C 320 200, 310 240, 280 250 C 240 260, 190 250, 160 220 C 150 190, 155 150, 170 140 Z" fill="url(#visorGrad)" stroke="#38bdf8" stroke-width="4"/>
    <!-- Reflejo en la visera -->
    <path d="M 190 155 C 230 150, 260 160, 280 185" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6"/>
    <!-- Toma de aire mentonera -->
    <rect x="185" y="295" width="45" height="12" rx="4" fill="#09090b" stroke="#71717a" stroke-width="2"/>
    <line x1="195" y1="298" x2="195" y2="304" stroke="#ef4444" stroke-width="2"/>
    <line x1="207" y1="298" x2="207" y2="304" stroke="#ef4444" stroke-width="2"/>
    <line x1="219" y1="298" x2="219" y2="304" stroke="#ef4444" stroke-width="2"/>
  </g>
  <text x="250" y="440" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle" letter-spacing="2">BIKERSTOCK3D HELMET</text>
</svg>

